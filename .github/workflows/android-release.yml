# OPTIONAL: signed release APK. Manual only. Needs 4 repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# The debug workflow (android-build.yml) never needs any of them.
name: Android Release (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Require signing secrets
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Release signing secrets are not configured. See README (release signing section). Use the debug workflow instead."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          TT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease -PttVersionCode=${{ github.run_number }}
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: task-time-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
